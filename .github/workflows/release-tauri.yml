name: Publish Tauri release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/backend.txt

      - name: Verify release version
        working-directory: frontend
        run: npm run version:check -- $env:GITHUB_REF_NAME

      - name: Require Clip Robin account configuration
        if: github.repository == 'abdullohtariq/ClipRobin'
        shell: pwsh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ($env:NEXT_PUBLIC_SUPABASE_URL -notmatch '^https://' -or $env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -notmatch '^sb_publishable_') {
            throw "Set the Supabase project URL and publishable key in GitHub Actions repository variables before publishing."
          }

      - name: Read app version for release notes
        id: app-version
        shell: pwsh
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Install and package the Python backend
        shell: pwsh
        run: |
          $repo = $PWD.Path
          python -m pip install --disable-pip-version-check pyinstaller -r requirements/backend.txt
          $packArgs = @(
            '--clean', '--noconfirm', '--onefile', '--windowed', '--icon', "$repo\backend\icon.ico"
            '--name', 'cliprobin-api', '--distpath', 'backend/dist'
            '--workpath', "$env:RUNNER_TEMP\pyinstaller-work", '--specpath', "$env:RUNNER_TEMP\pyinstaller-spec"
            '--collect-all', 'faster_whisper', '--collect-all', 'ctranslate2', '--collect-all', 'av'
            '--collect-all', 'tokenizers', '--collect-all', 'huggingface_hub', '--collect-all', 'uvicorn'
            '--collect-all', 'yt_dlp', '--collect-all', 'cv2'
            '--add-data', "$repo\backend\app\models\face_detection_yunet_2023mar.onnx;app/models"
            '--add-data', "$repo\backend\app\models\YUNET-LICENSE.txt;app/models"
            '--add-data', "$repo\backend\assets;assets"
            '--add-data', "$repo\clip_robin_watermark.png;assets"
            'backend/run.py'
          )
          python -m PyInstaller @packArgs

      - name: Stage FFmpeg static binaries for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/bin
          Write-Host "Downloading FFmpeg static essentials build..."
          $zipPath = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\ffmpeg_extracted" -Force
          $foundFfmpeg = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $foundFfprobe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item -Force $foundFfmpeg.FullName backend/bin/ffmpeg.exe
          Copy-Item -Force $foundFfprobe.FullName backend/bin/ffprobe.exe
          Write-Host "Staged FFmpeg: $((Get-Item backend/bin/ffmpeg.exe).Length) bytes"
          Write-Host "Staged FFprobe: $((Get-Item backend/bin/ffprobe.exe).Length) bytes"

      - name: Start the packaged backend and check its health
        shell: pwsh
        run: |
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $env:CLIPROBIN_API_PORT = [string]$probe.LocalEndpoint.Port
          $probe.Stop()
          $env:CLIPROBIN_API_TOKEN = [Guid]::NewGuid().ToString('N')
          $env:CLIPROBIN_PROJECTS_DIR = "$env:RUNNER_TEMP\cliprobin-smoke-projects"
          $env:CLIPROBIN_FFMPEG_DIR = (Resolve-Path backend/bin).Path
          $headers = @{ 'X-ClipRobin-Token' = $env:CLIPROBIN_API_TOKEN }
          $endpoint = "http://127.0.0.1:$env:CLIPROBIN_API_PORT/api/health"
          $backend = Start-Process -FilePath (Resolve-Path backend/dist/cliprobin-api.exe).Path -WindowStyle Hidden -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              if ($backend.HasExited) { throw "Packaged backend exited with code $($backend.ExitCode)." }
              try { $health = Invoke-RestMethod -Uri $endpoint -Headers $headers -TimeoutSec 2 }
              catch { Start-Sleep -Milliseconds 500 }
            } while ($health.status -ne 'healthy' -and [DateTime]::UtcNow -lt $deadline)
            if ($health.status -ne 'healthy') { throw 'Packaged backend did not become healthy.' }
          } finally {
            if (!$backend.HasExited) { taskkill.exe /PID $backend.Id /T /F | Out-Null }
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing a release."
          }

      - name: Build and publish signed Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLIPROBIN_ACCOUNT_URL: ${{ vars.NEXT_PUBLIC_CLIPROBIN_ACCOUNT_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Clip Robin ${{ github.ref_name }}
          releaseBody: |
            [Download the Windows installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Clip.Robin_${{ steps.app-version.outputs.version }}_x64-setup.exe)

            - Improved 9:16 speaker tracking handles camera cuts, filters false detections, and reduces brief jumps to listeners. Locked Crop keeps a fixed position without scanning faces.
            - Clip generation restores interrupted queue entries and improves handling of silent videos.
            - Account & Plans has clearer email recovery errors and support for Polar checkout, refunds, and Gemini credit balances. Public email delivery and paid upgrades require the hosted setup to be completed.

            Use the Windows installer above to install or update Clip Robin. Local editing and exports are available without an account.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
