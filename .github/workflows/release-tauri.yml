name: Publish Tauri release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/backend.txt

      - name: Verify release version
        working-directory: frontend
        run: npm run version:check -- $env:GITHUB_REF_NAME

      - name: Read app version for release notes
        id: app-version
        shell: pwsh
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Install and package the Python backend
        run: |
          python -m pip install --disable-pip-version-check pyinstaller -r requirements/backend.txt
          python -m PyInstaller --clean --noconfirm --onefile --name cliprobin-api --distpath backend/dist --workpath "$env:RUNNER_TEMP\pyinstaller-work" --specpath "$env:RUNNER_TEMP\pyinstaller-spec" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all tokenizers --collect-all huggingface_hub --collect-all uvicorn --collect-all yt_dlp backend/run.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing a release."
          }

      - name: Build and publish signed Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Clip Robin ${{ github.ref_name }}
          releaseBody: |
            [Download the Windows installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Clip.Robin_${{ steps.app-version.outputs.version }}_x64-setup.exe)

            GitHub automatically includes source-code archives on releases; they are not needed to install Clip Robin. Existing installations will be notified when this update is available.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
