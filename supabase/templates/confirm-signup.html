<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your Clip Robin email</title>
</head>
<body style="margin:0;background:#f4f5f7;color:#18181b;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 20px;color:#065f46;font-size:16px;font-weight:bold;">Clip Robin</p>
              <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;">Confirm your email</h1>
              <p style="margin:0 0 24px;color:#3f3f46;font-size:16px;line-height:1.6;">Verify this email address to finish creating your free Clip Robin account.</p>
              <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 22px;border-radius:8px;background:#065f46;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">Confirm email</a></p>
              <p style="margin:0 0 16px;color:#3f3f46;font-size:14px;line-height:1.6;">After confirming, return to Clip Robin and sign in.</p>
              <p style="margin:0;color:#52525b;font-size:14px;line-height:1.6;">If someone else entered your address, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
